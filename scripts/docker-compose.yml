# WatchList — local infrastructure (PostgreSQL + Redis)
# Managed by scripts/infra.sh. Project name "watchlist" groups these in Docker Desktop.
services:
  postgres:
    image: postgres:16
    container_name: watchlist-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: watchlist
      POSTGRES_DB: watchlist
    ports:
      - "5442:5432"          # host 5442 (5432 was taken) → matches DATABASE_PORT in ../.env
    volumes:
      - watchlist-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d watchlist"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: watchlist-redis
    # The app connects to redis at localhost:6379 (hard-coded in app/routers/movie_list.py)
    ports:
      - "6379:6379"
    volumes:
      - watchlist-redisdata:/data

volumes:
  watchlist-pgdata:
  watchlist-redisdata:
